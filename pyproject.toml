[project]
name = "severka-nano"
version = "0.1.0"
description = "Nano gpt model"
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Navik05" }]
dependencies = [
    "torch",
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/severka"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[project.scripts]

[tool.ruff]
line-length = 88
target-version = "py314"
exclude = [
    "data",
    "*.ipynb",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]